- insert:
    - id: papermoon-playbook-storage
      name: '@papermoon/playbook-storage/plugin'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/playbook.sqlite'"
    - id: papermoon-playbook-core
      name: '@papermoon/playbook-core/plugin'
    - id: papermoon-playbook-compiler
      name: '@papermoon/playbook-compiler/plugin'
      config:
        directory: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/compiled-playbooks'"
    - id: papermoon-playbook-editor
      name: '@papermoon/playbook-editor'
    - id: papermoon-writers
      # The pure package root is not a Cordis plugin; a file entry lets DSH discover its client half.
      name: './node_modules/@papermoon/writers/lib/index.js'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/writers.sqlite'"
    - id: papermoon-playbook-workspaces
      name: '@papermoon/playbook-workspaces'
      config:
        cwd: !!js process.cwd()
    - id: papermoon-performances
      name: '@papermoon/performances'
    - id: papermoon-writer-sessions
      name: '@papermoon/writer-sessions'
      config:
        cwd: !!js process.cwd()
- insert:
    - id: preset-papermoon-writer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: papermoon-writer
        name: 编剧
        description: PaperMoon writer conversation
        order: 15
        plugins: []
    - id: preset-papermoon-moderator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: papermoon-moderator
        name: 演绎
        description: PaperMoon text performance
        order: 16
        plugins: []
- insert:
    - id: papermoon-text-conversations
      name: '@papermoon/text-conversations'
    - id: papermoon-ui-guidance
      name: '@papermoon/ui-guidance'
