- insert:
    - id: papermoon-playbook-storage
      name: '../../plugins/playbook-storage/lib/plugin.js'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/playbook.sqlite'"
    - id: papermoon-playbook-core
      name: '../../plugins/playbook-core/lib/plugin.js'
    - id: papermoon-playbook-compiler
      name: '../../plugins/playbook-compiler/lib/plugin.js'
      config:
        directory: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/compiled-playbooks'"
    - id: papermoon-playbook-editor
      name: '../../plugins/playbook-editor/lib/index.js'
    - id: papermoon-writers
      name: '../../plugins/writers/lib/index.js'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/writers.sqlite'"
    - id: papermoon-playbook-workspaces
      name: '../../plugins/playbook-workspaces/lib/index.js'
      config:
        cwd: !!js process.cwd()
    - id: papermoon-performances
      name: '../../plugins/performances/lib/index.js'
    - id: papermoon-writer-sessions
      name: '../../plugins/writer-sessions/lib/index.js'
      config:
        cwd: !!js process.cwd()
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js process.cwd() + '/profiles/papermoon/presets'
        trust: system
