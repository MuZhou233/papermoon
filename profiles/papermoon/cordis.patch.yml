- insert:
    - id: papermoon-story-storage
      name: '../../plugins/story-storage/lib/plugin.js'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/story.sqlite'"
    - id: papermoon-story-core
      name: '../../plugins/story-core/lib/plugin.js'
    - id: papermoon-story-editor
      name: '../../plugins/story-editor/lib/index.js'
    - id: papermoon-writers
      name: '../../plugins/writers/lib/index.js'
      config:
        path: !!js "(process.env.PAPERMOON_DATA_DIR || '.papermoon') + '/writers.sqlite'"
    - id: papermoon-writer-sessions
      name: '../../plugins/writer-sessions/lib/index.js'
      config:
        cwd: !!js process.cwd()
- id: agent-presets
  config:
    default: standard
    roots:
      - path: !!js process.cwd() + '/profiles/papermoon/presets'
        trust: system
