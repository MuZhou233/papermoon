name: PaperMoon DSH integration
on:
  pull_request:
    paths:
      - dsh
      - plugins/story-storage/src/**
      - plugins/story-storage/integration/**
      - plugins/story-storage/tsconfig.build.json
      - plugins/story-storage/package.json
      - .gitmodules
      - patches/*.patch
      - patches/series.json
      - tooling/repository/**
      - tooling/checks/files.ts
      - tooling/tests/smoke.ts
      - package.json
      - .node-version
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/integration.yml
  push:
    branches: [main]
    paths:
      - dsh
      - plugins/story-storage/src/**
      - plugins/story-storage/integration/**
      - plugins/story-storage/tsconfig.build.json
      - plugins/story-storage/package.json
      - .gitmodules
      - patches/*.patch
      - patches/series.json
      - tooling/repository/**
      - tooling/checks/files.ts
      - tooling/tests/smoke.ts
      - package.json
      - .node-version
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/integration.yml
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dsh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm build
      - run: pnpm check:patches
      - run: pnpm check:plugins:dsh
      - run: pnpm test:smoke
