name: PaperMoon DSH integration
on:
  pull_request:
    paths:
      - dsh
      - plugins/playbook-storage/src/**
      - plugins/playbook-storage/integration/**
      - plugins/playbook-storage/tsconfig.build.json
      - plugins/playbook-storage/package.json
      - plugins/playbook-core/src/**
      - plugins/playbook-core/integration/**
      - plugins/playbook-core/tsconfig.build.json
      - plugins/playbook-core/package.json
      - plugins/writer-sessions/**
      - plugins/performances/**
      - plugins/story-mode/**
      - plugins/text-conversations/**
      - plugins/ui-guidance/**
      - plugins/playbook-workspaces/**
      - plugins/playbook-compiler/**
      - plugins/writers/src/**
      - plugins/writers/tsconfig.build.json
      - plugins/writers/package.json
      - plugins/playbook-tools/src/**
      - plugins/playbook-tools/integration/**
      - plugins/playbook-tools/tsconfig.build.json
      - plugins/playbook-tools/package.json
      - plugins/playbook-editor/src/**
      - plugins/playbook-editor/e2e/**
      - plugins/playbook-editor/playwright.config.ts
      - plugins/playbook-editor/package.json
      - packages/ui/src/**
      - packages/ui/package.json
      - profiles/**
      - .gitmodules
      - patches/**/*.patch
      - patches/series.json
      - tooling/repository/**
      - tooling/checks/files.ts
      - tooling/tests/smoke.ts
      - package.json
      - .node-version
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/integration.yml
  push:
    branches: [main]
    paths:
      - dsh
      - plugins/playbook-storage/src/**
      - plugins/playbook-storage/integration/**
      - plugins/playbook-storage/tsconfig.build.json
      - plugins/playbook-storage/package.json
      - plugins/playbook-core/src/**
      - plugins/playbook-core/integration/**
      - plugins/playbook-core/tsconfig.build.json
      - plugins/playbook-core/package.json
      - plugins/writer-sessions/**
      - plugins/performances/**
      - plugins/story-mode/**
      - plugins/text-conversations/**
      - plugins/ui-guidance/**
      - plugins/playbook-workspaces/**
      - plugins/playbook-compiler/**
      - plugins/writers/src/**
      - plugins/writers/tsconfig.build.json
      - plugins/writers/package.json
      - plugins/playbook-tools/src/**
      - plugins/playbook-tools/integration/**
      - plugins/playbook-tools/tsconfig.build.json
      - plugins/playbook-tools/package.json
      - plugins/playbook-editor/src/**
      - plugins/playbook-editor/e2e/**
      - plugins/playbook-editor/playwright.config.ts
      - plugins/playbook-editor/package.json
      - packages/ui/src/**
      - packages/ui/package.json
      - profiles/**
      - .gitmodules
      - patches/**/*.patch
      - patches/series.json
      - tooling/repository/**
      - tooling/checks/files.ts
      - tooling/tests/smoke.ts
      - package.json
      - .node-version
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/integration.yml
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            dsh/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm build
      - run: pnpm check:plugins:pure
      - run: pnpm check:patches
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.12'
      - run: uv run --project python/sdk --group test pytest python/sdk/tests/test_client.py
        working-directory: dsh
      - run: pnpm check:plugins:dsh
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:editor
      - run: pnpm test:writer-sessions
      - run: pnpm test:story-mode
